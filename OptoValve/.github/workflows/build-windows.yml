name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (JUCE fetched automatically)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
      - name: Build VST3 (Release)
        shell: pwsh
        run: cmake --build build --config Release --target OptoValve_VST3 --parallel 2
      - name: Package VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Filter 'OptoValve.vst3' -Recurse | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle was not produced' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $bundle.FullName dist/
          Compress-Archive -Path dist/OptoValve.vst3 -DestinationPath OptoValve-Windows-x64-VST3.zip -Force
      - name: Upload downloadable plugin
        uses: actions/upload-artifact@v4
        with:
          name: OptoValve-Windows-x64-VST3
          path: OptoValve-Windows-x64-VST3.zip
          if-no-files-found: error
